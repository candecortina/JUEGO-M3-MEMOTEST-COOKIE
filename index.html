<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Museo Memotest</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Bienvenida -->
<section id="welcome">
    <div class="welcome-box">
        <h1>🖼️ Museo Memotest</h1>
        <p>
            Encontrá los pares de obras del mismo artista para completar el recorrido.  
            Al final podrás acceder a la Galería del Museo con información de cada obra.  
            <br><br>
            Tenés <strong>60 segundos</strong> para completar el desafío.
        </p>
        <button id="start-btn">Comenzar</button>
    </div>
</section>

<!-- Juego -->
<section id="game" class="hidden">
    <div id="timer">Tiempo: 60s</div>
    <div id="board"></div>
</section>

<!-- Fin -->
<section id="end" class="hidden">
    <h2 id="end-title"></h2>
    <div id="gallery"></div>
    <button onclick="location.reload()">Reiniciar</button>
</section>

<!-- Modal -->
<div id="modal" class="hidden">
    <div class="modal-box">
        <span id="close-modal">✖</span>
        <img id="modal-img" src="">
        <p id="modal-desc"></p>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
