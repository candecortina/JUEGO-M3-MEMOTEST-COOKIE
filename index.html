<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArtMatch: Descubrí la Obra 🎨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎨 ArtMatch: Descubrí la Obra</h1>

    <div id="start-screen" class="screen">
      <p>Encontrá las parejas de cuadros y desbloqueá la galería final.</p>
      <button id="start-btn">Comenzar</button>
    </div>

    <div id="game-screen" class="screen hidden">
      <div id="game-board" class="game-board"></div>
    </div>

    <div id="gallery-screen" class="screen hidden">
      <h2>🖼️ Tu galería de arte</h2>
      <div id="gallery"></div>
      <button id="restart-btn">Jugar de nuevo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
