<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Memotest Museo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="welcome-screen">
    <h1>🖼️ Museo Memotest</h1>
    <p>
        Bienvenido/a al Museo Interactivo.  
        Encontrarás pares de obras del mismo artista.  
        Cuando encuentres todos los pares, ingresarás a la Galería Final, donde podrás ver cada obra en detalle.  
        <br><br>
        Tenés <strong>60 segundos</strong> para completar el recorrido.
    </p>
    <button id="start-btn">Comenzar</button>
</div>

<div id="game-screen" class="hidden">
    <div id="timer">Tiempo: 60s</div>
    <div id="board"></div>
</div>

<div id="end-screen" class="hidden">
    <h2 id="end-message"></h2>
    <div id="gallery"></div>
    <button onclick="location.reload()">Volver a comenzar</button>
</div>

<!-- Modal para vista previa -->
<div id="preview-modal" class="hidden">
    <div class="modal-content">
        <span id="close-preview">✖</span>
        <img id="preview-img" src="" alt="">
        <p id="preview-desc"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
