<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Match 🍪</title>
  <style>
    body {
      margin: 0;
      background-color: #fff7ed;
      font-family: "Poppins", "Comic Sans MS", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background-color: #fff3e0;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }

    h1 {
      color: #a86b4c;
      margin-bottom: 20px;
    }

    .instructions {
      background-color: #ffe0b2;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .instructions ul {
      text-align: left;
      margin: 10px auto;
      max-width: 300px;
    }

    button {
      background-color: #a86b4c;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
      transition: transform 0.2s, background-color 0.3s;
    }

    button:hover {
      background-color: #c17e5e;
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      width: 100px;
      height: 100px;
      background-color: #f5d7b3;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.4s, background-color 0.4s;
    }

    .card.flipped {
      background-color: #fff;
      transform: rotateY(180deg);
    }

    .message {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #5a3e2b;
      background-color: #ffebcc;
      border-radius: 10px;
      padding: 10px;
      display: inline-block;
      box-shadow: 0 3px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🍪 Cookie Match</h1>

    <div id="instructions" class="instructions">
      <h2>¡Bienvenida/o al Cookie Match!</h2>
      <p>Tu misión es descubrir qué ingredientes se combinan para crear deliciosas cookies.</p>
      <ul>
        <li>Da vuelta dos fichas a la vez.</li>
        <li>Si los ingredientes combinan, formarás una cookie especial.</li>
        <li>¡Completá todas para ganar!</li>
      </ul>
      <button id="start-btn">Comenzar</button>
    </div>

    <div id="game-area" class="hidden">
      <div id="game-board" class="game-board"></div>
      <div id="message" class="message hidden"></div>
      <button id="restart-btn" class="hidden">🔄 Jugar de nuevo</button>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const instructions = document.getElementById('instructions');
    const gameArea = document.getElementById('game-area');
    const gameBoard = document.getElementById('game-board');
    const message = document.getElementById('message');
    const restartBtn = document.getElementById('restart-btn');

    const pairs = [
      { ingredients: ['🥜 Pistacho', '🍫 Chocolate blanco'], name: 'Cookie Pistacho Dream' },
      { ingredients: ['🌾 Avena', '🍯 Miel'], name: 'Cookie Natural Crunch' },
      { ingredients: ['🍪 Chips de chocolate', '🌼 Vainilla'], name: 'Cookie Classic Chip' }
    ];

    let cards = [];
    let flippedCards = [];
    let matched = 0;

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', restartGame);

    function startGame() {
      instructions.classList.add('hidden');
      gameArea.classList.remove('hidden');
      createBoard();
    }

    function restartGame() {
      location.reload();
    }

    function createBoard() {
      cards = [];
      pairs.forEach(pair => {
        pair.ingredients.forEach(ingredient => {
          cards.push({ ingredient, pairName: pair.name });
        });
      });

      cards.sort(() => Math.random() - 0.5);
      gameBoard.innerHTML = '';

      cards.forEach(card => {
        const div = document.createElement('div');
        div.classList.add('card');
        div.dataset.pair = card.pairName;
        div.dataset.ingredient = card.ingredient;
        div.addEventListener('click', () => flipCard(div));
        gameBoard.appendChild(div);
      });
    }

    function flipCard(card) {
      if (flippedCards.length === 2 || card.classList.contains('flipped')) return;

      card.classList.add('flipped');
      card.textContent = card.dataset.ingredient;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        setTimeout(checkMatch, 600);
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;

      if (card1.dataset.pair === card2.dataset.pair && card1 !== card2) {
        showMessage(`🍪 ¡Combinación perfecta! Has creado la ${card1.dataset.pair}.`);
        matched += 2;
        flippedCards = [];

        if (matched === cards.length) {
          setTimeout(() => {
            showMessage('🎉 ¡Felicitaciones! Creaste todas las cookies 🍪');
            restartBtn.classList.remove('hidden');
          }, 800);
        }
      } else {
        flippedCards.forEach(c => {
          c.classList.remove('flipped');
          c.textContent = '';
        });
        flippedCards = [];
      }
    }

    function showMessage(text) {
      message.textContent = text;
      message.classList.remove('hidden');
      setTimeout(() => message.classList.add('hidden'), 2000);
    }
  </script>
</body>
</html>
