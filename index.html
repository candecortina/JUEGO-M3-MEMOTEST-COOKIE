<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memotest del Museo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- PANTALLA DE INICIO -->
    <div class="container" id="start-screen">
        <h1>🖼️ Memotest del Museo</h1>

        <p class="intro">
            Bienvenido al Museo interactivo.<br>
            Observá, memorizá y encontrá las parejas de las obras más icónicas de la historia del arte.<br><br>
            Cuando completes el tablero podrás acceder a la galería final donde verás información detallada
            de cada obra y su historia.
        </p>

        <button id="start-btn" class="start-btn">Comenzar</button>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div class="container hidden" id="game-screen">
        <h1>Memotest</h1>
        <p id="timer">Tiempo: 45s</p>
        <div id="game-board" class="game-board"></div>
    </div>

    <!-- RESULTADO -->
    <div class="container hidden" id="result-screen">
        <h1 id="result-title"></h1>
        <p id="result-text"></p>
        <div id="gallery"></div>
        <button onclick="location.reload()">Jugar de nuevo</button>
    </div>

    <!-- MODAL PREVIEW -->
    <div id="preview-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <img id="modal-img">
            <h2 id="modal-title"></h2>
            <p id="modal-desc"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
